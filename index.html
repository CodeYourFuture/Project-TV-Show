<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Khaliun Baatarkhuu (khaliun-dev)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <!-- Shows listing -->
    <div id="shows-view">
  <h1>TV Shows</h1>

  <input
    id="show-search-input"
    type="text"
    placeholder="Search shows"
  />

  <p id="show-count">Showing 0 shows</p>

  <div id="shows-root"></div>
</div>

    <!-- Episodes listing -->
    <div id="episodes-view" hidden>
      <a href="#" id="back-to-shows">← Back to Shows</a>

      <h1 id="selected-show-name"></h1>

      <input
        id="search-input"
        type="text"
        placeholder="Search episodes"
      />

      <select id="episode-selector"></select>

      <p id="episode-count"></p>

      <div id="root"></div>

      <p class="source">
        All data has been sourced from
        <a href="https://www.tvmaze.com/" target="_blank">TVMaze</a>
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
