<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Vito Moratti (vmoratti)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <section class="controls">
      <select id="episode-select">
        <option value="">Select an episode</option>
      </select>

      <input
        type="search"
        id="search-input"
        placeholder="Search episodes..."
      />

      <p id="episode-count"></p>
    </section>

    <main id="root"></main>
    <p>Loading episodes, please wait...</p>

    <template id="episode-template">
      <article class="episode">
        <h3 class="title">Episode title</h3>
        <img alt="Episode poster" />
        <p class="synopsis">Episode summary</p>
      </article>
    </template>

    <footer>
      <p>&copy; TV. All rights reserved.</p>
    </footer>

    <script defer src="script.js"></script>
  </body>
</html>
