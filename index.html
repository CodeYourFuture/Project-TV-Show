<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Vito Moratti (vmoratti)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

 <body>
  <!-- Shows page -->
  <section id="shows-page">
    <h1>TV Shows</h1>

    <input
      type="search"
      id="show-search"
      placeholder="Search shows..."
    />

    <p id="show-count"></p>

    <main id="shows-root"></main>
  </section>

  <!-- Episodes page -->
  <section id="episodes-page" hidden>
    <button id="back-to-shows">← Back to shows</button>

    <section class="controls">
      <select id="show-select">
        <option value="">Select a show</option>
      </select>

      <select id="episode-select">
        <option value="">Select an episode</option>
      </select>

      <input
        type="search"
        id="search-input"
        placeholder="Search episodes..."
      />

      <p id="episode-count"></p>
    </section>

    <p id="status">Loading episodes, please wait...</p>

    <main id="root"></main>
  </section>

  <!-- Template for episodes -->
  <template id="episode-template">
    <article class="episode">
      <h3 class="title">Episode title</h3>
      <img alt="Episode poster" />
      <p class="synopsis">Episode summary</p>
    </article>
  </template>

  <footer>
    <p>
      &copy; TV. All rights reserved.
    </p>
  </footer>

  <script defer src="script.js"></script>
</body>
</html>
